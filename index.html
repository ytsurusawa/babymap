<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4CAF7D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ベビーマップ">
<meta name="description" content="おむつ替え・授乳室・多目的トイレを地図で検索">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<title>🚼 ベビーマップ Japan</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --mint:#4CAF7D;--mint-d:#2E8B57;--mint-l:#E8F8F0;--mint-ll:#F0FAF5;
  --peach:#FF8A65;--peach-l:#FFF0EB;
  --sky:#64B5F6;--sky-l:#E8F4FE;
  --lav:#CE93D8;--lav-l:#F8EEff;
  --sun:#FFD54F;--sun-l:#FFFDE7;
  --rose:#F48FB1;--rose-l:#FEF0F5;
  --text:#3D3D3D;--text2:#888;--bg:#FAFCFA;--bg2:#F2F7F4;
  --card:#fff;--border:rgba(0,0,0,0.08);
  --shadow:0 2px 12px rgba(76,175,125,0.12);
  --r:16px;--rb:24px;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden;
  font-family:'Hiragino Maru Gothic Pro','Rounded Mplus 1c','Noto Sans JP','YuGothic',sans-serif;
  background:var(--bg);color:var(--text);}
#app{display:flex;flex-direction:column;height:100%;}

/* ヘッダー */
#hdr{
  background:linear-gradient(135deg,#4CAF7D 0%,#66BB8A 100%);
  color:#fff;padding:calc(12px + var(--sat)) 16px 12px;
  flex-shrink:0;
  box-shadow:0 2px 12px rgba(76,175,125,0.3);
}
#hdr-inner{display:flex;align-items:center;gap:10px;}
#hdr-icon{font-size:28px;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.15));}
#hdr-text h1{font-size:17px;font-weight:700;letter-spacing:.02em;}
#hdr-text p{font-size:10px;opacity:.85;margin-top:2px;}

/* 検索バー */
#srow{
  padding:10px 12px;background:var(--bg2);
  border-bottom:1px solid var(--border);flex-shrink:0;
  display:flex;gap:8px;position:relative;z-index:500;
}
#swrap{flex:1;position:relative;}
#sinput{
  width:100%;height:40px;padding:0 38px 0 16px;
  border-radius:20px;border:2px solid transparent;
  font-size:13px;background:var(--card);color:var(--text);outline:none;
  box-shadow:var(--shadow);transition:border-color .2s;
}
#sinput:focus{border-color:var(--mint);}
#sinput::placeholder{color:#bbb;}
#sclear{
  display:none;position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;font-size:15px;color:#ccc;padding:4px;
}
#suggest{
  display:none;position:absolute;top:46px;left:0;right:0;
  background:var(--card);border:2px solid var(--mint-l);border-radius:var(--r);
  z-index:9999;box-shadow:0 8px 24px rgba(76,175,125,0.2);overflow:hidden;
}
.sg{
  padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
  -webkit-tap-highlight-color:transparent;
}
.sg:last-child{border-bottom:none;}
.sg:active{background:var(--mint-ll);}
.sg-ico{font-size:20px;width:26px;text-align:center;}
.sg-name{font-size:12px;font-weight:700;color:var(--text);}
.sg-addr{font-size:10px;color:var(--text2);margin-top:2px;}
#lbtn{
  width:40px;height:40px;border-radius:50%;
  background:linear-gradient(135deg,#4CAF7D,#66BB8A);
  border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;box-shadow:0 2px 8px rgba(76,175,125,0.4);
  -webkit-tap-highlight-color:transparent;
}
#lbtn svg{width:18px;height:18px;fill:#fff;}

/* フィルターチップ */
#frow{
  display:flex;gap:6px;padding:8px 12px;overflow-x:auto;
  flex-shrink:0;border-bottom:1px solid var(--border);background:var(--bg2);
}
#frow::-webkit-scrollbar{display:none;}
.chip{
  flex-shrink:0;padding:6px 13px;border-radius:20px;font-size:11px;font-weight:600;
  cursor:pointer;border:2px solid transparent;background:var(--card);
  color:var(--text2);white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,0.08);
  transition:all .15s;-webkit-tap-highlight-color:transparent;
}
.chip.active{background:var(--mint);color:#fff;border-color:var(--mint);box-shadow:0 2px 8px rgba(76,175,125,0.3);}
.chip[data-f="diaper"].active{background:#FF8A65;border-color:#FF8A65;}
.chip[data-f="nursing"].active{background:#CE93D8;border-color:#CE93D8;}
.chip[data-f="barrier"].active{background:#64B5F6;border-color:#64B5F6;}
.chip[data-f="ostomate"].active{background:#F48FB1;border-color:#F48FB1;}

/* 地図 */
#map{flex:1;position:relative;z-index:0;min-height:0;}
.leaflet-container{font-family:inherit;}
.leaflet-control-zoom{border:none!important;box-shadow:var(--shadow)!important;}
.leaflet-control-zoom a{
  width:32px!important;height:32px!important;line-height:32px!important;
  border-radius:50%!important;border:none!important;
  background:var(--card)!important;color:var(--mint-d)!important;
  font-size:16px!important;font-weight:700!important;margin-bottom:4px!important;
  box-shadow:0 2px 8px rgba(0,0,0,.1)!important;
}
/* タイルを柔らかく */
.leaflet-tile{filter:saturate(0.85) brightness(1.02);}

/* ボトムシート */
#bot{
  background:var(--card);border-top:2px solid var(--mint-l);
  flex-shrink:0;max-height:58vh;overflow-y:auto;
  padding-bottom:var(--sab);
  border-radius:var(--rb) var(--rb) 0 0;
  box-shadow:0 -4px 20px rgba(76,175,125,0.1);
}
#pull{
  width:40px;height:4px;background:var(--mint-l);
  border-radius:2px;margin:10px auto 4px;
}

/* 施設詳細 */
#det{display:none;padding:4px 14px 16px;}
#det.show{display:block;}
.det-head{
  background:linear-gradient(135deg,var(--mint-ll),var(--bg2));
  border-radius:var(--r);padding:12px;margin-bottom:10px;
  border:1px solid var(--mint-l);
}
.dn{font-size:16px;font-weight:700;color:var(--text);margin-bottom:3px;}
.da{font-size:11px;color:var(--text2);}
.dtags{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0;}
.tag{
  padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;
  display:flex;align-items:center;gap:4px;
}
.t-diaper{background:var(--peach-l);color:#D84315;}
.t-barrier{background:var(--sky-l);color:#1565C0;}
.t-nursing{background:var(--lav-l);color:#6A1B9A;}
.t-ostomate{background:var(--rose-l);color:#880E4F;}
.drow{
  display:flex;align-items:center;gap:8px;padding:7px 0;
  border-top:1px solid var(--border);font-size:12px;color:var(--text2);
}
.drow span:last-child{color:var(--text);margin-left:auto;font-size:12px;font-weight:600;}
.dfeats{
  margin-top:8px;background:var(--mint-ll);border-radius:12px;
  padding:10px 12px;font-size:11px;color:var(--mint-d);line-height:1.9;
}
.dsrc{font-size:10px;color:var(--text2);margin-top:7px;text-align:right;}
.nbtn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  width:100%;margin-top:10px;padding:12px;border-radius:var(--rb);
  background:linear-gradient(135deg,#4CAF7D,#66BB8A);
  color:#fff;border:none;font-size:14px;font-weight:700;cursor:pointer;
  box-shadow:0 3px 12px rgba(76,175,125,0.35);
  -webkit-tap-highlight-color:transparent;
}
.nbtn:active{opacity:.85;}

/* 施設リスト */
#lhdr{
  padding:10px 14px 4px;font-size:12px;color:var(--text2);font-weight:700;
  display:flex;align-items:center;justify-content:space-between;
}
#dnote{font-size:10px;color:var(--mint);}
.fi{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-bottom:1px solid var(--border);cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:background .1s;
}
.fi:active{background:var(--mint-ll);}
.fic{
  width:42px;height:42px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:22px;box-shadow:0 2px 6px rgba(0,0,0,.08);
}
.fin{flex:1;min-width:0;}
.finame{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);}
.fisub{font-size:10px;color:var(--text2);margin-top:2px;}
.fidist{
  font-size:11px;font-weight:600;color:var(--mint-d);
  background:var(--mint-ll);padding:3px 7px;border-radius:10px;flex-shrink:0;
}
.fempty{padding:30px 20px;text-align:center;color:var(--text2);font-size:13px;line-height:2;}

/* ローディング */
#loading{
  position:absolute;inset:0;
  background:rgba(240,250,245,.95);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:1000;
}
.spinner{
  width:48px;height:48px;border:4px solid var(--mint-l);
  border-top-color:var(--mint);border-radius:50%;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.ldt{font-size:14px;color:var(--mint-d);font-weight:700;}
.lds{font-size:11px;color:var(--text2);}
.load-icon{font-size:36px;animation:bounce 1s ease infinite alternate;}
@keyframes bounce{from{transform:translateY(0);}to{transform:translateY(-8px);}}

/* オフライン */
#offbar{
  display:none;position:absolute;top:0;left:0;right:0;
  background:#FF7043;color:#fff;font-size:12px;text-align:center;
  padding:6px;z-index:999;border-radius:0 0 8px 8px;
}
#offbar.show{display:block;}

/* インストール */
#insbar{
  display:none;position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(135deg,#4CAF7D,#66BB8A);
  color:#fff;padding:12px 16px;z-index:998;
  flex-direction:column;gap:8px;border-radius:var(--rb) var(--rb) 0 0;
}
#insbar.show{display:flex;}
#insbar p{font-size:13px;font-weight:700;}
#insbar small{font-size:10px;opacity:.85;}
.irow{display:flex;gap:8px;}
#ibtn{flex:1;padding:9px;border-radius:20px;background:#fff;color:var(--mint-d);border:none;font-size:13px;font-weight:700;cursor:pointer;}
#ino{padding:9px 14px;border-radius:20px;background:transparent;color:#fff;border:2px solid rgba(255,255,255,.5);font-size:12px;cursor:pointer;}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <div id="hdr-inner">
      <div id="hdr-icon">🚼</div>
      <div id="hdr-text">
        <h1>ベビーマップ Japan</h1>
        <p>おむつ替え・授乳室・多目的トイレを地図で検索</p>
      </div>
    </div>
  </div>

  <div id="srow">
    <div id="swrap">
      <input id="sinput" type="search" placeholder="🔍 住所・駅名・エリアで検索..." autocomplete="off">
      <button id="sclear" onclick="clearSearch()">✕</button>
      <div id="suggest"></div>
    </div>
    <button id="lbtn" aria-label="現在地を取得">
      <svg viewBox="0 0 24 24"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0013 3.06V1h-2v2.06A8.994 8.994 0 003.06 11H1v2h2.06A8.994 8.994 0 0011 20.94V23h2v-2.06A8.994 8.994 0 0020.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
    </button>
  </div>

  <div id="frow">
    <div class="chip active" data-f="all">🗺 すべて</div>
    <div class="chip" data-f="diaper">🍼 おむつ替え</div>
    <div class="chip" data-f="nursing">🤱 授乳室</div>
    <div class="chip" data-f="barrier">♿ バリアフリー</div>
    <div class="chip" data-f="ostomate">🏥 オストメイト</div>
  </div>

  <div id="map">
    <div id="loading">
      <div class="load-icon">🚼</div>
      <div class="spinner"></div>
      <div class="ldt">周辺施設を検索中...</div>
      <div class="lds">OpenStreetMapからデータを取得しています</div>
    </div>
    <div id="offbar">📡 オフラインです。移動すると最新データを取得します</div>
  </div>

  <div id="bot">
    <div id="pull"></div>
    <div id="det">
      <div class="det-head">
        <div class="dn" id="dn"></div>
        <div class="da" id="da"></div>
      </div>
      <div class="dtags" id="dtags"></div>
      <div class="drow"><span>🕐</span><span>営業時間</span><span id="dhours"></span></div>
      <div class="drow"><span>📍</span><span>現在地から</span><span id="ddist"></span></div>
      <div class="drow"><span>♿</span><span>アクセス</span><span id="daccess"></span></div>
      <div class="dfeats" id="dfeats" style="display:none"></div>
      <div class="dsrc" id="dsrc"></div>
      <button class="nbtn" id="nbtn">🗺 Google マップでナビ</button>
    </div>
    <div id="lhdr"><span id="lcnt">付近の施設</span><span id="dnote"></span></div>
    <div id="flist"></div>
  </div>

  <div id="insbar">
    <p>📲 ホーム画面に追加できます</p>
    <small>インターネットなしでも使えるアプリとして保存できます</small>
    <div class="irow"><button id="ibtn">インストール</button><button id="ino">後で</button></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ================================================
// 施設タイプ別アイコン定義（用途に応じた絵文字）
// ================================================
function getFacilityIcon(tags, amenity) {
  // タグの組み合わせで最適なアイコンを選ぶ
  const hasD = tags.includes('diaper');
  const hasN = tags.includes('nursing');
  const hasB = tags.includes('barrier');
  const hasO = tags.includes('ostomate');

  if (hasD && hasN) return { em:'🍼', bg:'#FF8A65', label:'おむつ替え＋授乳' };
  if (hasD)         return { em:'🍼', bg:'#FFA07A', label:'おむつ替え台' };
  if (hasN)         return { em:'🤱', bg:'#CE93D8', label:'授乳室' };
  if (hasO)         return { em:'🏥', bg:'#F48FB1', label:'オストメイト' };
  if (hasB)         return { em:'♿', bg:'#64B5F6', label:'多目的トイレ' };
  return            { em:'🚻', bg:'#A5D6A7', label:'トイレ' };
}

// ================================================
// 定数・状態
// ================================================
const RADIUS = 2000;
const DEFAULT_LAT = 35.6762, DEFAULT_LNG = 139.6503;

const TAGMAP = {
  diaper:  ['🍼 おむつ替え',   't-diaper'],
  barrier: ['♿ バリアフリー', 't-barrier'],
  nursing: ['🤱 授乳室',       't-nursing'],
  ostomate:['🏥 オストメイト', 't-ostomate'],
};

let map, uMarker;
let uLat = DEFAULT_LAT, uLng = DEFAULT_LNG;
let facs = [], mkMap = {}, selId = null, curF = 'all';
let moveTimer = null, lastPos = null;
let deferredPrompt = null, geoTimer = null;

// ================================================
// 地図初期化
// ================================================
function initMap() {
  map = L.map('map', {zoomControl:true}).setView([uLat, uLng], 15);

  // やわらかいタイルスタイル
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom:19,
  }).addTo(map);

  placeUser(uLat, uLng);

  map.on('moveend', () => {
    const c = map.getCenter();
    clearTimeout(moveTimer);
    moveTimer = setTimeout(() => fetchFacilities(c.lat, c.lng), 700);
  });
}

function placeUser(lat, lng) {
  const ico = L.divIcon({
    className:'',
    html:`<div style="
      width:22px;height:22px;border-radius:50%;
      background:linear-gradient(135deg,#4CAF7D,#66BB8A);
      border:3px solid #fff;
      box-shadow:0 0 0 5px rgba(76,175,125,0.25),0 2px 8px rgba(0,0,0,0.2);
    "></div>`,
    iconSize:[22,22], iconAnchor:[11,11],
  });
  if (uMarker) uMarker.setLatLng([lat,lng]);
  else uMarker = L.marker([lat,lng],{icon:ico,zIndexOffset:1000}).addTo(map).bindPopup('📍 現在地');
}

function makeMkIcon(f) {
  const ico = getFacilityIcon(f.tags, f.amenity);
  const isSel = f.id === selId;
  const sz = isSel ? 44 : 38;
  const ring = isSel ? `box-shadow:0 0 0 5px rgba(76,175,125,0.3),0 3px 10px rgba(0,0,0,0.2);transform:scale(1.05);` : `box-shadow:0 2px 8px rgba(0,0,0,0.2);`;
  return L.divIcon({
    className:'',
    html:`<div style="
      width:${sz}px;height:${sz}px;border-radius:50%;
      background:${ico.bg};border:3px solid #fff;
      display:flex;align-items:center;justify-content:center;
      font-size:${isSel?22:18}px;${ring}
      transition:all .2s;
    ">${ico.em}</div>`,
    iconSize:[sz,sz], iconAnchor:[sz/2,sz/2], popupAnchor:[0,-sz/2],
  });
}

// ================================================
// Overpass API — 全国対応・リアルタイム
// ================================================
async function fetchFacilities(lat, lng) {
  const posKey = `${lat.toFixed(3)},${lng.toFixed(3)}`;
  if (posKey === lastPos) return;
  lastPos = posKey;

  setLoad(true, '施設データを取得中...');
  document.getElementById('dnote').textContent = '取得中...';

  const query = `
[out:json][timeout:25];
(
  node["amenity"="toilets"]["changing_table"="yes"](around:${RADIUS},${lat},${lng});
  node["amenity"="toilets"]["wheelchair"="yes"](around:${RADIUS},${lat},${lng});
  node["amenity"="toilets"]["ostomate"="yes"](around:${RADIUS},${lat},${lng});
  node["amenity"="nursing_room"](around:${RADIUS},${lat},${lng});
  node["amenity"="baby_hatch"](around:${RADIUS},${lat},${lng});
  node["changing_table"="yes"](around:${RADIUS},${lat},${lng});
  node["toilets:wheelchair"="yes"](around:${RADIUS},${lat},${lng});
  way["amenity"="toilets"]["changing_table"="yes"](around:${RADIUS},${lat},${lng});
  way["amenity"="toilets"]["wheelchair"="yes"](around:${RADIUS},${lat},${lng});
);
out center tags;
  `.trim();

  try {
    const res = await fetch('https://overpass-api.de/api/interpreter', {
      method:'POST', body:query,
      signal:AbortSignal.timeout(18000),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    facs = parseOverpass(json.elements || [], lat, lng);
    document.getElementById('dnote').textContent = `OpenStreetMap（${facs.length}件）`;
  } catch(e) {
    console.warn('Overpass:', e.message);
    document.getElementById('dnote').textContent = '取得失敗 — 地図を動かして再試行';
    facs = [];
  }

  renderMk();
  renderList();
  setLoad(false);
}

function parseOverpass(els, cLat, cLng) {
  const seen = new Set();
  return els.map(el => {
    const t = el.tags || {};
    const lat = el.lat ?? el.center?.lat;
    const lng = el.lon ?? el.center?.lon;
    if (!lat || !lng) return null;

    const key = `${lat.toFixed(5)},${lng.toFixed(5)}`;
    if (seen.has(key)) return null;
    seen.add(key);

    const tags = [];
    if (t.changing_table === 'yes' || t['changing_table:fee'] === 'no') tags.push('diaper');
    if (t.wheelchair === 'yes' || t['toilets:wheelchair'] === 'yes') tags.push('barrier');
    if (t.amenity === 'nursing_room' || t['healthcare:nursing_room'] === 'yes' || t.amenity === 'baby_hatch') tags.push('nursing');
    if (t.ostomate === 'yes' || t['toilets:ostomate'] === 'yes') tags.push('ostomate');
    if (!tags.length) tags.push('barrier');

    const feats = [];
    if (t.changing_table === 'yes') feats.push('🍼 おむつ替え台あり');
    if (t.changing_table_location) feats.push(`📍 おむつ台の場所: ${t.changing_table_location}`);
    if (t.wheelchair === 'yes') feats.push('♿ 車椅子対応');
    if (t.ostomate === 'yes') feats.push('🏥 オストメイト設備');
    if (t.fee === 'no') feats.push('💴 無料');
    if (t.fee === 'yes') feats.push('💴 有料');
    if (t['changing_table:count']) feats.push(`🍼 おむつ台 ${t['changing_table:count']}台`);

    const name = t.name || t['name:ja'] || amenityLabel(t.amenity);
    const addr = [t['addr:prefecture'], t['addr:city'], t['addr:street']].filter(Boolean).join('');

    return {
      id:`${el.type}${el.id}`,
      name, addr, amenity: t.amenity,
      tags, feats,
      lat, lng,
      hours: t.opening_hours || '詳細不明',
      access: t.wheelchair === 'yes' ? '車椅子対応' : '詳細不明',
      source:'OpenStreetMap contributors',
    };
  }).filter(Boolean)
    .sort((a,b) => gdist(cLat,cLng,a.lat,a.lng) - gdist(cLat,cLng,b.lat,b.lng));
}

function amenityLabel(a) {
  return {toilets:'トイレ',nursing_room:'授乳室',baby_hatch:'ベビーステーション'}[a] || '施設';
}

// ================================================
// 住所検索（Nominatim — 無料・CORS対応）
// ================================================
const suggestEl = document.getElementById('suggest');

document.getElementById('sinput').addEventListener('input', e => {
  const q = e.target.value.trim();
  document.getElementById('sclear').style.display = q ? 'block' : 'none';
  clearTimeout(geoTimer);
  if (!q) { suggestEl.style.display='none'; return; }
  geoTimer = setTimeout(() => fetchSuggest(q), 350);
});

document.getElementById('sinput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); geocode(document.getElementById('sinput').value.trim()); }
});

async function fetchSuggest(q) {
  try {
    const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=6&countrycodes=jp&accept-language=ja`;
    const r = await fetch(url, {headers:{'Accept-Language':'ja'}});
    const items = await r.json();
    if (!items.length) { suggestEl.style.display='none'; return; }
    suggestEl.innerHTML = items.map(item => {
      const parts = item.display_name.split(',');
      const name = parts[0].trim();
      const addr = parts.slice(1,3).join(',').trim();
      const ico = geoIco(item.type, item.class);
      return `<div class="sg" onclick="moveToGeo(${item.lat},${item.lon},'${esc(name)}')">
        <span class="sg-ico">${ico}</span>
        <div><div class="sg-name">${esc(name)}</div><div class="sg-addr">${esc(addr)}</div></div>
      </div>`;
    }).join('');
    suggestEl.style.display = 'block';
  } catch(e) { suggestEl.style.display='none'; }
}

async function geocode(q) {
  if (!q) return;
  setLoad(true, `「${q}」を検索中...`);
  suggestEl.style.display = 'none';
  try {
    const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1&countrycodes=jp&accept-language=ja`;
    const r = await fetch(url, {headers:{'Accept-Language':'ja'}});
    const items = await r.json();
    if (items.length) moveToGeo(items[0].lat, items[0].lon, items[0].display_name.split(',')[0]);
    else { setLoad(false); alert(`「${q}」が見つかりませんでした。`); }
  } catch(e) { setLoad(false); alert('検索に失敗しました。'); }
}

window.moveToGeo = function(lat, lng, name) {
  suggestEl.style.display = 'none';
  document.getElementById('sinput').value = name;
  document.getElementById('sclear').style.display = 'block';
  uLat = parseFloat(lat); uLng = parseFloat(lng);
  placeUser(uLat, uLng);
  lastPos = null;
  map.setView([uLat, uLng], 15, {animate:true});
  setLoad(false);
};

window.clearSearch = function() {
  document.getElementById('sinput').value = '';
  document.getElementById('sclear').style.display = 'none';
  suggestEl.style.display = 'none';
};

function geoIco(type, cls) {
  if (cls==='railway'||type==='station') return '🚃';
  if (type==='hospital') return '🏥';
  if (cls==='leisure') return '🌳';
  if (cls==='shop') return '🏪';
  if (type==='city'||type==='town'||type==='village') return '🏘';
  return '📍';
}

document.addEventListener('click', e => {
  if (!document.getElementById('swrap').contains(e.target)) suggestEl.style.display='none';
});

// ================================================
// レンダリング
// ================================================
function renderMk() {
  const vis = facs.filter(f => curF==='all' || f.tags.includes(curF));
  const visIds = new Set(vis.map(f=>f.id));
  Object.entries(mkMap).forEach(([id,m])=>{if(!visIds.has(id)){map.removeLayer(m);delete mkMap[id];}});
  vis.forEach(f => {
    const ico = makeMkIcon(f);
    if (mkMap[f.id]) mkMap[f.id].setIcon(ico);
    else {
      const m = L.marker([f.lat,f.lng],{icon:ico}).addTo(map);
      m.on('click', () => selF(f.id));
      mkMap[f.id] = m;
    }
  });
}

function renderList() {
  let items = facs;
  if (curF !== 'all') items = items.filter(f=>f.tags.includes(curF));

  document.getElementById('lcnt').textContent = `付近の施設（${items.length}件）`;

  if (!items.length) {
    document.getElementById('flist').innerHTML =
      `<div class="fempty">🔍 この周辺にデータがまだありません。<br>地図を動かして別のエリアを試してください！<br><small style="color:#bbb;font-size:10px;">※OpenStreetMapへの登録数に依存します</small></div>`;
    return;
  }

  document.getElementById('flist').innerHTML = items.map(f => {
    const ico = getFacilityIcon(f.tags, f.amenity);
    const d = fmtd(uLat,uLng,f.lat,f.lng);
    return `<div class="fi" onclick="selF('${f.id}')">
      <div class="fic" style="background:${ico.bg}20;">${ico.em}</div>
      <div class="fin">
        <div class="finame">${esc(f.name)}</div>
        <div class="fisub">${f.tags.map(t=>TAGMAP[t]?.[0]||'').join(' · ')}</div>
      </div>
      <div class="fidist">${d}</div>
    </div>`;
  }).join('');
}

window.selF = function(id) {
  selId = id;
  const f = facs.find(x=>x.id===id);
  if (!f) return;
  renderMk();
  map.setView([f.lat,f.lng], Math.max(map.getZoom(),16), {animate:true});

  const ico = getFacilityIcon(f.tags, f.amenity);
  document.getElementById('dn').innerHTML = `${ico.em} ${esc(f.name)}`;
  document.getElementById('da').textContent = f.addr || '住所情報なし';
  document.getElementById('dhours').textContent = f.hours;
  document.getElementById('ddist').textContent = fmtd(uLat,uLng,f.lat,f.lng);
  document.getElementById('daccess').textContent = f.access;
  document.getElementById('dtags').innerHTML = f.tags.map(t=>{
    const[l,c]=TAGMAP[t]||[t,''];return`<span class="tag ${c}">${l}</span>`;
  }).join('');

  const featsEl = document.getElementById('dfeats');
  if (f.feats.length) {
    featsEl.innerHTML = f.feats.map(x=>`${x}`).join('<br>');
    featsEl.style.display = 'block';
  } else {
    featsEl.style.display = 'none';
  }

  document.getElementById('dsrc').textContent = `データ: ${f.source}`;
  document.getElementById('det').classList.add('show');
  document.getElementById('bot').scrollTo({top:0,behavior:'smooth'});
};

document.getElementById('nbtn').onclick = () => {
  const f = facs.find(x=>x.id===selId);
  if (f) window.open(`https://maps.google.com/?q=${f.lat},${f.lng}&hl=ja`,'_blank');
};

// ================================================
// フィルター・イベント
// ================================================
document.querySelectorAll('.chip').forEach(c => {
  c.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
    c.classList.add('active');
    curF = c.dataset.f;
    renderMk(); renderList();
    document.getElementById('det').classList.remove('show');
  });
});

document.getElementById('lbtn').addEventListener('click', () => {
  if (!navigator.geolocation) { alert('位置情報がサポートされていません'); return; }
  setLoad(true, '📍 現在地を取得中...');
  navigator.geolocation.getCurrentPosition(
    pos => {
      uLat=pos.coords.latitude; uLng=pos.coords.longitude;
      placeUser(uLat, uLng);
      map.setView([uLat,uLng],15,{animate:true});
      clearSearch();
      lastPos=null;
      fetchFacilities(uLat, uLng);
    },
    err => { setLoad(false); alert(`位置情報エラー: ${err.message}`); },
    {enableHighAccuracy:true, timeout:10000}
  );
});

// ================================================
// ユーティリティ
// ================================================
function gdist(a,b,c,d){
  const R=6371000,dA=(c-a)*Math.PI/180,dB=(d-b)*Math.PI/180;
  const e=Math.sin(dA/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dB/2)**2;
  return R*2*Math.atan2(Math.sqrt(e),Math.sqrt(1-e));
}
function fmtd(a,b,c,d){const m=gdist(a,b,c,d);return m<1000?`${Math.round(m)}m`:`${(m/1000).toFixed(1)}km`;}
function setLoad(s,msg=''){
  const el=document.getElementById('loading');
  el.style.display=s?'flex':'none';
  if(msg)el.querySelector('.ldt').textContent=msg;
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ================================================
// オフライン・PWA
// ================================================
window.addEventListener('online',()=>document.getElementById('offbar').classList.remove('show'));
window.addEventListener('offline',()=>document.getElementById('offbar').classList.add('show'));
if(!navigator.onLine)document.getElementById('offbar').classList.add('show');

window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredPrompt=e;
  document.getElementById('insbar').classList.add('show');
});
document.getElementById('ibtn').onclick=async()=>{
  if(!deferredPrompt)return;
  deferredPrompt.prompt();await deferredPrompt.userChoice;
  deferredPrompt=null;document.getElementById('insbar').classList.remove('show');
};
document.getElementById('ino').onclick=()=>document.getElementById('insbar').classList.remove('show');

// ================================================
// 起動
// ================================================
window.addEventListener('load',()=>{
  if('serviceWorker' in navigator)
    navigator.serviceWorker.register('sw.js').catch(()=>{});

  initMap();

  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      pos=>{
        uLat=pos.coords.latitude;uLng=pos.coords.longitude;
        placeUser(uLat,uLng);
        map.setView([uLat,uLng],15,{animate:false});
        fetchFacilities(uLat,uLng);
      },
      ()=>fetchFacilities(uLat,uLng),
      {enableHighAccuracy:true,timeout:6000}
    );
  } else {
    fetchFacilities(uLat,uLng);
  }
});
</script>
